<section class="cta" id="contacto" aria-labelledby="cta-title">
  <div class="cta__bg" aria-hidden="true"></div>

  <div class="cta__inner" aylluReveal>
    <p class="cta__eyebrow">Contacto</p>
    <h2 id="cta-title" class="cta__title">Coordinemos una demo a tu medida</h2>
    <p class="cta__lead">
      Sin formularios largos ni esperas. Escríbenos por WhatsApp, cuéntanos cómo administras
      hoy tus cobros, y coordinamos un espacio para mostrarte Ayllu funcionando.
    </p>

    <a
      [href]="config.contact.whatsapp.finalCta"
      target="_blank"
      rel="noopener noreferrer"
      class="cta__button"
    >
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path
          d="M12.04 2c-5.5 0-9.96 4.46-9.96 9.96 0 1.76.46 3.48 1.34 5L2 22l5.2-1.36a9.94 9.94 0 0 0 4.84 1.24h.01c5.5 0 9.96-4.46 9.96-9.96S17.54 2 12.04 2Zm5.86 14.07c-.25.7-1.45 1.34-2 1.43-.51.08-1.15.11-1.86-.12-.43-.14-.98-.32-1.68-.63-2.96-1.28-4.89-4.25-5.04-4.45-.15-.2-1.2-1.6-1.2-3.05 0-1.45.76-2.16 1.03-2.46.27-.3.59-.37.79-.37.2 0 .4 0 .57.01.18.01.43-.07.67.51.25.6.85 2.08.92 2.23.07.15.12.33.02.53-.1.2-.15.33-.3.5-.15.18-.31.4-.44.53-.15.15-.3.31-.13.61.17.3.76 1.25 1.63 2.02 1.12 1 2.06 1.31 2.36 1.46.3.15.48.13.65-.08.18-.2.75-.87.95-1.17.2-.3.4-.25.67-.15.28.1 1.75.83 2.05.98.3.15.5.23.57.35.08.13.08.72-.17 1.42Z"
        />
      </svg>
      Escribir por WhatsApp
    </a>

    <p class="cta__phone">{{ config.contact.phoneDisplay }}</p>
  </div>
</section>
