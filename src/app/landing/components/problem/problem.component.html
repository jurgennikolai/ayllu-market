<section class="problem" aria-labelledby="problem-title">
  <div class="problem__inner">
    <header class="problem__header" aylluReveal>
      <p class="problem__eyebrow">El problema</p>
      <h2 id="problem-title" class="problem__title">
        Si administras cobros hoy, esto te suena conocido
      </h2>
    </header>

    <div class="problem__grid">
      @for (point of painPoints; track point.title; let i = $index) {
        <article class="problem__card" aylluReveal [aylluRevealDelay]="i * 90">
          <span class="problem__icon" aria-hidden="true">
            @switch (point.icon) {
              @case ('sheet') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <rect x="3" y="4" width="18" height="16" rx="2" />
                  <path d="M3 9h18M9 9v11" />
                </svg>
              }
              @case ('receipt') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M6 2h12v19l-3-2-3 2-3-2-3 2V2Z" />
                  <path d="M9 8h6M9 12h6" />
                </svg>
              }
              @case ('search') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <circle cx="10.5" cy="10.5" r="6.5" />
                  <path d="m20 20-4.35-4.35" />
                </svg>
              }
              @case ('chart') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M4 20V10M12 20V4M20 20v-7" />
                </svg>
              }
            }
          </span>
          <h3 class="problem__card-title">{{ point.title }}</h3>
          <p class="problem__card-text">{{ point.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
